dedication: "Este sítio é uma pequena homenagem a Santo Onofre, meu protetor, que, com as suas súplicas ao Senhor, me ajudou e me ajuda em situações difíceis."
translationNotice: "As traduções deste sítio são oferecidas como auxílio ao leitor. Certas passagens – sobretudo os textos litúrgicos e patrísticos em grego antigo – têm um peso teológico que só pode ser plenamente expresso no original grego; por isso, pede-se ao leitor que consulte sempre o original grego antes de tirar quaisquer conclusões. A edição impressa (livro em PDF) está disponível apenas em grego."
